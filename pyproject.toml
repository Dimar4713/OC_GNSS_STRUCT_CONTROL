[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation-control"
version = "0.2.3"
description = "Reproducible research platform for stable orbital constellation design and control"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
authors = [{name = "AIMETON / OC GNSS STRUCT CONTROL"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "pyarrow>=17",
  "matplotlib>=3.9",
  "plotly>=5.23",
  "cvxpy>=1.5",
  "pymoo>=0.6.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
preview = ["fastapi>=0.115", "uvicorn>=0.30"]
orekit = ["orekit-jpype==13.1.5.0"]
dev = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.28",
  "pytest>=8.3",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
constellation-control = "constellation_control.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["constellation_control*"]
namespaces = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
