name: diagnose-long-validation

on:
  pull_request:
    paths:
      - 'scenarios/regression/glo_source_linearization_validation_engineer.yaml'
      - 'scripts/reproduce_long_validation.py'
      - '.github/workflows/diagnose-long-validation.yml'
      - 'src/constellation_control/adapters/orekit/**'
      - 'src/constellation_control/application/run.py'
      - 'sidecar/orekit-service/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OREKIT_DATA_PATH: ${{ github.workspace }}/.orekit-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sidecar/orekit-service/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Load pinned Orekit data identity
        shell: bash
        run: |
          set -euo pipefail
          echo "OREKIT_DATA_REVISION=$(tr -d '[:space:]' < sidecar/orekit-service/orekit-data-revision.txt)" >> "$GITHUB_ENV"
          echo "OREKIT_DATA_SHA256=$(tr -d '[:space:]' < sidecar/orekit-service/orekit-data-sha256.txt)" >> "$GITHUB_ENV"
          echo "OREKIT_DATA_MIRROR_REVISION=$(tr -d '[:space:]' < sidecar/orekit-service/orekit-data-mirror-revision.txt)" >> "$GITHUB_ENV"
      - name: Fetch and verify pinned Orekit data
        shell: bash
        run: |
          set -euo pipefail
          git init "$OREKIT_DATA_PATH"
          git -C "$OREKIT_DATA_PATH" remote add origin https://gitlab.orekit.org/orekit/orekit-data.git
          fetched=false
          for attempt in 1 2 3 4; do
            if timeout 30s git -C "$OREKIT_DATA_PATH" fetch --depth 1 origin "$OREKIT_DATA_REVISION"; then fetched=true; break; fi
            sleep "$((attempt * 2))"
          done
          if test "$fetched" = true; then
            git -C "$OREKIT_DATA_PATH" checkout --detach FETCH_HEAD
          else
            rm -rf "$OREKIT_DATA_PATH"
            mirror_dir="$RUNNER_TEMP/orekit-data-mirror"
            git init "$mirror_dir"
            git -C "$mirror_dir" remote add origin https://github.com/fndtnl/orekit-data-snapshot.git
            git -C "$mirror_dir" fetch --depth 1 origin "$OREKIT_DATA_MIRROR_REVISION"
            git -C "$mirror_dir" checkout --detach FETCH_HEAD
            mkdir -p "$OREKIT_DATA_PATH"
            cp -a "$mirror_dir/orekit/orekit-data/." "$OREKIT_DATA_PATH/"
          fi
          test "$(python scripts/fingerprint_orekit_data.py "$OREKIT_DATA_PATH")" = "$OREKIT_DATA_SHA256"
      - name: Build sidecar and install Python application
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -f sidecar/orekit-service/pom.xml test package
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Start Orekit authority
        shell: bash
        run: |
          set -euo pipefail
          java -jar sidecar/orekit-service/target/orekit-service-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/orekit-sidecar.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/orekit-sidecar.pid"
          for i in $(seq 1 120); do
            if curl --noproxy '*' -fsS http://127.0.0.1:8081/healthz > "$RUNNER_TEMP/orekit-health.json"; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/orekit-health.json"
          grep -q '13.1.7' "$RUNNER_TEMP/orekit-health.json"
      - name: Stage 1 — one day
        shell: bash
        run: |
          set -o pipefail
          python scripts/reproduce_long_validation.py --source scenarios/regression/glo_source_linearization_validation_engineer.yaml --work "$RUNNER_TEMP/diag-1d" --duration 86400 2>&1 | tee "$RUNNER_TEMP/diag-1d.log"
      - name: Stage 2 — one hundred days
        shell: bash
        run: |
          set -o pipefail
          python scripts/reproduce_long_validation.py --source scenarios/regression/glo_source_linearization_validation_engineer.yaml --work "$RUNNER_TEMP/diag-100d" --duration 8640000 2>&1 | tee "$RUNNER_TEMP/diag-100d.log"
      - name: Stage 3 — one year completes with precision-floor guard
        shell: bash
        run: |
          set -o pipefail
          python scripts/reproduce_long_validation.py --source scenarios/regression/glo_source_linearization_validation_engineer.yaml --work "$RUNNER_TEMP/diag-1y" --duration 31536000 2>&1 | tee "$RUNNER_TEMP/diag-1y.log"
          grep -F 'RESULT success duration_s=3.1536e+07' "$RUNNER_TEMP/diag-1y.log"
          if grep -F 'unable to compute DSST mean parameters after 201 iterations' "$RUNNER_TEMP/diag-1y.log"; then
            echo 'DSST mean reconstruction precision-floor failure reappeared' >&2
            exit 1
          fi
          echo 'Confirmed staged validation: 1d PASS, 100d PASS, 1y PASS.'
      - name: Dump authority log on unexpected failure
        if: failure()
        shell: bash
        run: |
          tail -n 300 "$RUNNER_TEMP/orekit-sidecar.log" || true
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-validation-diagnostic-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/diag-1d.log
            ${{ runner.temp }}/diag-100d.log
            ${{ runner.temp }}/diag-1y.log
            ${{ runner.temp }}/orekit-sidecar.log
            ${{ runner.temp }}/orekit-health.json
