name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/constellation_control
      - name: Tests
        run: pytest -q

  orekit-java:
    runs-on: ubuntu-latest
    env:
      OREKIT_DATA_PATH: ${{ github.workspace }}/.orekit-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sidecar/orekit-service/pom.xml
      - name: Load reviewed Orekit data revision
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < sidecar/orekit-service/orekit-data-revision.txt)"
          [[ "$pinned" =~ ^[0-9a-f]{40}$ ]]
          echo "OREKIT_DATA_REVISION=$pinned" >> "$GITHUB_ENV"
          echo "OREKIT_DATA_PINNED_REVISION=$pinned"
      - name: Report official Orekit data main revision
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote https://gitlab.orekit.org/orekit/orekit-data.git refs/heads/main | awk '{print $1}')"
          test -n "$current"
          echo "OREKIT_DATA_MAIN_REVISION=$current"
          echo "OREKIT_DATA_PINNED_REVISION=$OREKIT_DATA_REVISION"
      - name: Fetch pinned official Orekit data
        shell: bash
        run: |
          set -euo pipefail
          git init "$OREKIT_DATA_PATH"
          git -C "$OREKIT_DATA_PATH" remote add origin https://gitlab.orekit.org/orekit/orekit-data.git
          git -C "$OREKIT_DATA_PATH" fetch --depth 1 origin "$OREKIT_DATA_REVISION"
          git -C "$OREKIT_DATA_PATH" checkout --detach FETCH_HEAD
          test "$(git -C "$OREKIT_DATA_PATH" rev-parse HEAD)" = "$OREKIT_DATA_REVISION"
      - name: Compile and execute Orekit integration tests
        run: mvn -B -f sidecar/orekit-service/pom.xml test
      - name: Build Orekit sidecar executable
        run: mvn -B -f sidecar/orekit-service/pom.xml -DskipTests package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python application for HTTP E2E
        run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Start authoritative Orekit sidecar
        shell: bash
        run: |
          set -euo pipefail
          export OREKIT_PORT=8081
          nohup java -jar sidecar/orekit-service/target/orekit-service-0.1.0-SNAPSHOT.jar \
            > /tmp/orekit-service.log 2>&1 &
          echo "$!" > /tmp/orekit-service.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8081/healthz > /tmp/orekit-health.json; then
              cat /tmp/orekit-health.json
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads(Path('/tmp/orekit-health.json').read_text())
          assert health['status'] == 'ok'
          assert health['backend'] == 'orekit'
          assert health['orekit_version'] == '13.1.7'
          assert health['orekit_data_revision'] == os.environ['OREKIT_DATA_REVISION']
          assert len(health['orekit_data_sha256']) == 64
          int(health['orekit_data_sha256'], 16)
          PY
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/orekit-service.pid)" 2>/dev/null; then
              cat /tmp/orekit-service.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/orekit-service.log
          exit 1
      - name: Execute DSST design via Python CLI and HTTP
        shell: bash
        run: |
          set -euo pipefail
          constellation-control run scenarios/orekit_design_smoke.yaml --output .e2e-runs/design
          design_dir="$(find .e2e-runs/design/synthetic-orekit-dsst-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$design_dir"
          echo "DESIGN_RUN_DIR=$design_dir" >> "$GITHUB_ENV"
      - name: Verify DSST design artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_high_fidelity_run.py "$DESIGN_RUN_DIR" \
            --backend orekit-dsst-design \
            --mode design \
            --data-revision "$OREKIT_DATA_REVISION"
      - name: Execute numerical validation via Python CLI and HTTP
        shell: bash
        run: |
          set -euo pipefail
          constellation-control run scenarios/orekit_validation_smoke.yaml --output .e2e-runs/validation
          validation_dir="$(find .e2e-runs/validation/synthetic-orekit-validation-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$validation_dir"
          echo "VALIDATION_RUN_DIR=$validation_dir" >> "$GITHUB_ENV"
      - name: Verify numerical validation artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_high_fidelity_run.py "$VALIDATION_RUN_DIR" \
            --backend orekit-numerical-validation \
            --mode validation \
            --data-revision "$OREKIT_DATA_REVISION"
      - name: Stop Orekit sidecar
        if: always()
        shell: bash
        run: |
          if test -f /tmp/orekit-service.pid; then
            kill "$(cat /tmp/orekit-service.pid)" 2>/dev/null || true
          fi
          cat /tmp/orekit-service.log 2>/dev/null || true
