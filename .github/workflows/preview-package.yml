name: preview-package-compat

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Compatibility workflow retained so any existing required check names keep
# resolving. It intentionally does NOT publish a second Preview artifact.
# The only canonical Windows release artifact is built by preview-0.2-package.yml.

jobs:
  windows-preview-smoke:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Preview test environment
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Preserve required Windows check name for Preview 0.2.4
        shell: powershell
        run: |
          $text = [System.IO.File]::ReadAllText((Resolve-Path preview\start-preview.ps1), [System.Text.Encoding]::UTF8)
          [void][scriptblock]::Create($text)
          if ($text -notmatch 'Engineering Preview Python 0\.2\.4') { throw 'Canonical launcher is not Preview 0.2.4' }
          pytest -q tests/test_preview_consolidated_release.py tests/test_preview_windows_bootstrap_contract.py tests/test_orekit_http.py tests/test_orekit_adapter_contract.py

  build-preview-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert canonical release workflow owns packaging
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'BUNDLE_NAME: engineering-preview-python-0.2.4-win10' .github/workflows/preview-0.2-package.yml
          grep -F 'name: engineering-preview-python-0.2.4-win10' .github/workflows/preview-0.2-package.yml
          grep -F 'legacy preview/app.py must not ship' .github/workflows/preview-0.2-package.yml
          if grep -Eq 'BUNDLE_NAME: engineering-preview-python-0\.1\.[0-9]+-win10|name: engineering-preview-python-0\.1\.[0-9]+-win10|Upload Engineering Preview 0\.1\.' .github/workflows/preview-package.yml; then
            echo 'obsolete 0.1.x artifact publication must remain retired' >&2
            exit 1
          fi
          echo 'Required compatibility check retained; canonical 0.2.4 artifact publication delegated to preview-0.2-package.yml.'
