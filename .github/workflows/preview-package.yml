name: preview-package-compat

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Compatibility workflow retained so existing required check names keep resolving.
# It does not publish an artifact. The canonical release workflow is preview-release-package.yml.

jobs:
  windows-preview-smoke:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Preview test environment
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Preserve required Windows compatibility check
        shell: powershell
        run: |
          $text = [System.IO.File]::ReadAllText((Resolve-Path preview\start-preview.ps1), [System.Text.Encoding]::UTF8)
          [void][scriptblock]::Create($text)
          $canonical = python -c "from constellation_control.version import __version__; print(__version__)"
          $installed = python -c "import importlib.metadata; print(importlib.metadata.version('constellation-control'))"
          if ($installed.Trim() -ne $canonical.Trim()) { throw 'Installed package version diverges from canonical version source' }
          pytest -q tests/test_preview_consolidated_release.py tests/test_preview_windows_bootstrap_contract.py tests/test_orekit_http.py tests/test_orekit_adapter_contract.py

  build-preview-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert canonical release workflow owns packaging
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/preview-release-package.yml
          grep -F 'from constellation_control.version import __version__ as PREVIEW_VERSION' src/constellation_control/preview/gravity_release_app.py
          grep -F "version = {attr = \"constellation_control.version.__version__\"}" pyproject.toml
          if grep -ERn 'engineering-preview-python-[0-9]+\.[0-9]+\.[0-9]+-win10|PREVIEW_VERSION[[:space:]]*=[[:space:]]*["'"'][0-9]+\.[0-9]+\.[0-9]+' .github/workflows/preview-release-package.yml; then
            echo 'release workflow must derive version and artifact identity from canonical version source' >&2
            exit 1
          fi
          if grep -Eq 'BUNDLE_NAME: engineering-preview-python-0\.1\.[0-9]+-win10|name: engineering-preview-python-0\.1\.[0-9]+-win10|Upload Engineering Preview 0\.1\.' .github/workflows/preview-package.yml; then
            echo 'obsolete 0.1.x artifact publication must remain retired' >&2
            exit 1
          fi
          echo 'Required compatibility check retained; release identity is derived from canonical version source.'
