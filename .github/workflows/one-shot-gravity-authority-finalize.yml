name: one-shot gravity authority finalize

on:
  push:
    branches: [feat/orekit-dsst-validation]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orekit-dsst-validation
          fetch-depth: 0
      - name: Finalize explicit gravity authority contracts
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"finalize anchor missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Python validation fixture must declare the same authority as real scenarios.
          replace_once(
              "tests/test_roe_linearization.py",
              "    FrameName,\n    IntegratorConfig,",
              "    FrameName,\n    GravityModelName,\n    IntegratorConfig,",
          )
          replace_once(
              "tests/test_roe_linearization.py",
              "        mode=ForceMode.VALIDATION,\n        mu_m3_s2=",
              "        mode=ForceMode.VALIDATION,\n        gravity_model=GravityModelName.EIGEN_6S,\n        mu_m3_s2=",
          )

          # Health must expose authority before the first propagation request.
          replace_once(
              "sidecar/orekit-service/src/main/java/ru/aimeton/gnss/orekit/OrekitServiceMain.java",
              '        body.put("orekit_data_sha256", runtime.dataSha256());\n',
              '        body.put("orekit_data_sha256", runtime.dataSha256());\n'
              '        body.put("gravity_model", runtime.gravityModel());\n',
          )

          # Full run evidence locks YAML -> HTTP -> manifest gravity identity.
          replace_once(
              "scripts/verify_high_fidelity_run.py",
              '    assert manifest["force_model"]["gravity_degree"] == 8\n',
              '    assert manifest["force_model"]["gravity_model"] == "EIGEN-6S"\n'
              '    assert manifest["force_model"]["gravity_degree"] == 8\n',
          )
          replace_once(
              "scripts/verify_high_fidelity_run.py",
              '    assert metadata["orekit_version"] == "13.1.7"\n',
              '    assert metadata["orekit_version"] == "13.1.7"\n'
              '    assert metadata["gravity_model"] == "EIGEN-6S"\n',
          )
          replace_once(
              "scripts/verify_high_fidelity_run.py",
              '    assert scenario["force_model"]["mode"] == expected_mode\n',
              '    assert scenario["force_model"]["mode"] == expected_mode\n'
              '    assert scenario["force_model"]["gravity_model"] == "EIGEN-6S"\n',
          )

          # Fresh-runtime gravity choice is a hard regression assertion.
          replace_once(
              "sidecar/orekit-service/src/test/java/ru/aimeton/gnss/orekit/FreshGravityAuthorityTest.java",
              "import static org.junit.jupiter.api.Assertions.assertTrue;\n",
              "import static org.junit.jupiter.api.Assertions.assertEquals;\n"
              "import static org.junit.jupiter.api.Assertions.assertTrue;\n",
          )
          replace_once(
              "sidecar/orekit-service/src/test/java/ru/aimeton/gnss/orekit/FreshGravityAuthorityTest.java",
              "        assertTrue(Double.isFinite(provider.getMu()) && provider.getMu() > 0.0);\n",
              "        assertEquals(OrekitRuntime.GRAVITY_MODEL, fresh.gravityModel());\n"
              "        assertTrue(Math.abs(provider.getMu() - 3.986004418e14) / 3.986004418e14 < 1.0e-8);\n"
              "        assertTrue(Double.isFinite(provider.getMu()) && provider.getMu() > 0.0);\n",
          )

          # Health check and real finite-difference MPC smoke share the same sidecar process.
          replace_once(
              ".github/workflows/ci.yml",
              "          assert health['orekit_version'] == '13.1.7'\n",
              "          assert health['orekit_version'] == '13.1.7'\n"
              "          assert health['gravity_model'] == 'EIGEN-6S'\n",
          )
          linearization_step = """      - name: Derive MPC matrices from real Orekit numerical authority
          shell: bash
          run: |
            set -euo pipefail
            python scripts/verify_orekit_linearization.py \\
              scenarios/orekit_linearization_smoke.yaml \\
              --output .e2e-runs/linearization
"""
          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          if "Derive MPC matrices from real Orekit numerical authority" not in text:
              anchor = "      - name: Stop Orekit sidecar\n"
              if anchor not in text:
                  raise SystemExit("CI stop-sidecar anchor missing")
              text = text.replace(anchor, linearization_step + anchor, 1)
              ci.write_text(text, encoding="utf-8")

          # Make automatic gravity reader selection explicitly forbidden in canonical docs.
          paragraph = (
              "High-fidelity scenarios must declare `gravity_model: EIGEN-6S`. "
              "The Java authority clears Orekit's automatic potential-coefficient readers "
              "and installs only the ICGEM reader for `^eigen-6s-truncated$`. The model name "
              "is part of the force-model fingerprint and runtime metadata; reader-load-order "
              "selection is forbidden.\n"
          )
          for path in (
              "docs/architecture.md",
              "docs/validation.md",
              "docs/scenario-schema.md",
              "sidecar/orekit-service/README.md",
          ):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if "^eigen-6s-truncated$" not in text:
                  p.write_text(text + "\n## Explicit gravity authority\n\n" + paragraph, encoding="utf-8")

          for transient in (
              ".github/workflows/one-shot-gravity-authority-migration.yml",
              ".github/workflows/one-shot-gravity-authority-finalize.yml",
          ):
              Path(transient).unlink(missing_ok=True)
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: finalize EIGEN-6S authority and real Orekit MPC gate"
          git push origin HEAD:feat/orekit-dsst-validation
