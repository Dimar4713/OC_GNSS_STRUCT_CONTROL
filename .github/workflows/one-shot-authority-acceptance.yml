name: one-shot authority acceptance

on:
  push:
    branches: [feat/orekit-dsst-validation]

permissions:
  contents: write

concurrency:
  group: one-shot-authority-acceptance
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    env:
      OREKIT_DATA_PATH: ${{ github.workspace }}/.orekit-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orekit-dsst-validation
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sidecar/orekit-service/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Idempotently finalize authority migration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"authority migration anchor missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/test_roe_linearization.py",
              "    FrameName,\n    IntegratorConfig,",
              "    FrameName,\n    GravityModelName,\n    IntegratorConfig,",
          )
          replace_once(
              "tests/test_roe_linearization.py",
              "        mode=ForceMode.VALIDATION,\n        mu_m3_s2=",
              "        mode=ForceMode.VALIDATION,\n        gravity_model=GravityModelName.EIGEN_6S,\n        mu_m3_s2=",
          )
          replace_once(
              "sidecar/orekit-service/src/main/java/ru/aimeton/gnss/orekit/OrekitServiceMain.java",
              '        body.put("orekit_data_sha256", runtime.dataSha256());\n',
              '        body.put("orekit_data_sha256", runtime.dataSha256());\n'
              '        body.put("gravity_model", runtime.gravityModel());\n',
          )
          replace_once(
              "scripts/verify_high_fidelity_run.py",
              '    assert manifest["force_model"]["gravity_degree"] == 8\n',
              '    assert manifest["force_model"]["gravity_model"] == "EIGEN-6S"\n'
              '    assert manifest["force_model"]["gravity_degree"] == 8\n',
          )
          replace_once(
              "scripts/verify_high_fidelity_run.py",
              '    assert metadata["orekit_version"] == "13.1.7"\n',
              '    assert metadata["orekit_version"] == "13.1.7"\n'
              '    assert metadata["gravity_model"] == "EIGEN-6S"\n',
          )
          replace_once(
              "scripts/verify_high_fidelity_run.py",
              '    assert scenario["force_model"]["mode"] == expected_mode\n',
              '    assert scenario["force_model"]["mode"] == expected_mode\n'
              '    assert scenario["force_model"]["gravity_model"] == "EIGEN-6S"\n',
          )
          replace_once(
              "sidecar/orekit-service/src/test/java/ru/aimeton/gnss/orekit/FreshGravityAuthorityTest.java",
              "import static org.junit.jupiter.api.Assertions.assertTrue;\n",
              "import static org.junit.jupiter.api.Assertions.assertEquals;\n"
              "import static org.junit.jupiter.api.Assertions.assertTrue;\n",
          )
          replace_once(
              "sidecar/orekit-service/src/test/java/ru/aimeton/gnss/orekit/FreshGravityAuthorityTest.java",
              "        assertTrue(Double.isFinite(provider.getMu()) && provider.getMu() > 0.0);\n",
              "        assertEquals(OrekitRuntime.GRAVITY_MODEL, fresh.gravityModel());\n"
              "        assertTrue(Math.abs(provider.getMu() - 3.986004418e14) / 3.986004418e14 < 1.0e-8);\n"
              "        assertTrue(Double.isFinite(provider.getMu()) && provider.getMu() > 0.0);\n",
          )
          replace_once(
              ".github/workflows/ci.yml",
              "          assert health['orekit_version'] == '13.1.7'\n",
              "          assert health['orekit_version'] == '13.1.7'\n"
              "          assert health['gravity_model'] == 'EIGEN-6S'\n",
          )

          linearization_step = """      - name: Derive MPC matrices from real Orekit numerical authority
          shell: bash
          run: |
            set -euo pipefail
            python scripts/verify_orekit_linearization.py \\
              scenarios/orekit_linearization_smoke.yaml \\
              --output .e2e-runs/linearization
"""
          ci = Path(".github/workflows/ci.yml")
          ci_text = ci.read_text(encoding="utf-8")
          if "Derive MPC matrices from real Orekit numerical authority" not in ci_text:
              anchor = "      - name: Stop Orekit sidecar\n"
              if anchor not in ci_text:
                  raise SystemExit("CI stop-sidecar anchor missing")
              ci.write_text(ci_text.replace(anchor, linearization_step + anchor, 1), encoding="utf-8")

          docs_paragraph = (
              "High-fidelity scenarios must declare `gravity_model: EIGEN-6S`. "
              "The Java authority clears Orekit automatic potential-coefficient readers and "
              "installs only the ICGEM reader for `^eigen-6s-truncated$`; reader-load-order "
              "selection is forbidden.\n"
          )
          for path in (
              "docs/architecture.md",
              "docs/validation.md",
              "docs/scenario-schema.md",
              "sidecar/orekit-service/README.md",
          ):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if "^eigen-6s-truncated$" not in text:
                  p.write_text(text + "\n## Explicit gravity authority\n\n" + docs_paragraph, encoding="utf-8")

          for transient in Path(".github/workflows").glob("one-shot-*.yml"):
              transient.unlink()

      - name: Load reviewed data revision
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < sidecar/orekit-service/orekit-data-revision.txt)"
          [[ "$pinned" =~ ^[0-9a-f]{40}$ ]]
          echo "OREKIT_DATA_REVISION=$pinned" >> "$GITHUB_ENV"

      - name: Fetch exact reviewed Orekit data
        shell: bash
        run: |
          set -euo pipefail
          git init "$OREKIT_DATA_PATH"
          git -C "$OREKIT_DATA_PATH" remote add origin https://gitlab.orekit.org/orekit/orekit-data.git
          git -C "$OREKIT_DATA_PATH" fetch --depth 1 origin "$OREKIT_DATA_REVISION"
          git -C "$OREKIT_DATA_PATH" checkout --detach FETCH_HEAD
          test "$(git -C "$OREKIT_DATA_PATH" rev-parse HEAD)" = "$OREKIT_DATA_REVISION"

      - name: Install Python stack
        run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Python quality gates
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          mypy src/constellation_control
          pytest -q

      - name: Java/Orekit integration authority
        run: mvn -B -f sidecar/orekit-service/pom.xml test
      - name: Build sidecar
        run: mvn -B -f sidecar/orekit-service/pom.xml -DskipTests package

      - name: Start clean authoritative sidecar
        shell: bash
        run: |
          set -euo pipefail
          export OREKIT_PORT=8081
          nohup java -jar sidecar/orekit-service/target/orekit-service-0.1.0-SNAPSHOT.jar \
            > /tmp/orekit-service.log 2>&1 &
          echo "$!" > /tmp/orekit-service.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8081/healthz > /tmp/orekit-health.json; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          health = json.loads(Path('/tmp/orekit-health.json').read_text())
          assert health['status'] == 'ok'
          assert health['backend'] == 'orekit'
          assert health['orekit_version'] == '13.1.7'
          assert health['gravity_model'] == 'EIGEN-6S'
          assert health['orekit_data_revision'] == os.environ['OREKIT_DATA_REVISION']
          assert len(health['orekit_data_sha256']) == 64
          int(health['orekit_data_sha256'], 16)
          PY
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/orekit-service.pid)" 2>/dev/null; then
              cat /tmp/orekit-service.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/orekit-service.log
          exit 1

      - name: Full DSST design E2E
        shell: bash
        run: |
          set -euo pipefail
          constellation-control run scenarios/orekit_design_smoke.yaml --output .acceptance/design
          run_dir="$(find .acceptance/design/synthetic-orekit-dsst-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python scripts/verify_high_fidelity_run.py "$run_dir" \
            --backend orekit-dsst-design --mode design --data-revision "$OREKIT_DATA_REVISION"

      - name: Full numerical validation E2E
        shell: bash
        run: |
          set -euo pipefail
          constellation-control run scenarios/orekit_validation_smoke.yaml --output .acceptance/validation
          run_dir="$(find .acceptance/validation/synthetic-orekit-validation-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python scripts/verify_high_fidelity_run.py "$run_dir" \
            --backend orekit-numerical-validation --mode validation --data-revision "$OREKIT_DATA_REVISION"

      - name: Real Orekit finite-difference MPC evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_orekit_linearization.py \
            scenarios/orekit_linearization_smoke.yaml \
            --output .acceptance/linearization

      - name: Stop sidecar
        if: always()
        shell: bash
        run: |
          if test -f /tmp/orekit-service.pid; then
            kill "$(cat /tmp/orekit-service.pid)" 2>/dev/null || true
          fi
          cat /tmp/orekit-service.log 2>/dev/null || true

      - name: Commit accepted migration and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: accept deterministic EIGEN-6S high-fidelity authority"
          git push origin HEAD:feat/orekit-dsst-validation

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-acceptance-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/orekit-service.log
            /tmp/orekit-health.json
            .acceptance/
            sidecar/orekit-service/target/surefire-reports/
