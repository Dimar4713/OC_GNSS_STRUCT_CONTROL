name: preview-0.2-package

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-025-bundle:
    runs-on: ubuntu-latest
    env:
      OREKIT_DATA_PATH: ${{ github.workspace }}/.orekit-data
      BUNDLE_NAME: engineering-preview-python-0.2.5-win10
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: sidecar/orekit-service/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load reviewed Orekit data authority
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < sidecar/orekit-service/orekit-data-revision.txt)"
          physical_sha="$(tr -d '[:space:]' < sidecar/orekit-service/orekit-data-sha256.txt)"
          mirror_revision="$(tr -d '[:space:]' < sidecar/orekit-service/orekit-data-mirror-revision.txt)"
          [[ "$pinned" =~ ^[0-9a-f]{40}$ ]]
          [[ "$physical_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$mirror_revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "OREKIT_DATA_REVISION=$pinned" >> "$GITHUB_ENV"
          echo "OREKIT_DATA_SHA256=$physical_sha" >> "$GITHUB_ENV"
          echo "OREKIT_DATA_MIRROR_REVISION=$mirror_revision" >> "$GITHUB_ENV"
          echo "PREVIEW_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Fetch reviewed Orekit data with verified fallback
        shell: bash
        run: |
          set -euo pipefail
          git init "$OREKIT_DATA_PATH"
          git -C "$OREKIT_DATA_PATH" remote add origin https://gitlab.orekit.org/orekit/orekit-data.git
          fetched=false
          for attempt in 1 2 3 4; do
            if timeout 30s git -C "$OREKIT_DATA_PATH" fetch --depth 1 origin "$OREKIT_DATA_REVISION"; then
              fetched=true
              break
            fi
            sleep "$((attempt * 2))"
          done
          if test "$fetched" = true; then
            git -C "$OREKIT_DATA_PATH" checkout --detach FETCH_HEAD
            test "$(git -C "$OREKIT_DATA_PATH" rev-parse HEAD)" = "$OREKIT_DATA_REVISION"
          else
            rm -rf "$OREKIT_DATA_PATH"
            mirror_dir="$RUNNER_TEMP/orekit-data-mirror"
            git init "$mirror_dir"
            git -C "$mirror_dir" remote add origin https://github.com/fndtnl/orekit-data-snapshot.git
            git -C "$mirror_dir" fetch --depth 1 origin "$OREKIT_DATA_MIRROR_REVISION"
            git -C "$mirror_dir" checkout --detach FETCH_HEAD
            test "$(git -C "$mirror_dir" rev-parse HEAD)" = "$OREKIT_DATA_MIRROR_REVISION"
            mkdir -p "$OREKIT_DATA_PATH"
            cp -a "$mirror_dir/orekit/orekit-data/." "$OREKIT_DATA_PATH/"
          fi
          actual_sha="$(python scripts/fingerprint_orekit_data.py "$OREKIT_DATA_PATH")"
          test "$actual_sha" = "$OREKIT_DATA_SHA256"
      - name: Build authoritative Orekit sidecar
        run: mvn -B -f sidecar/orekit-service/pom.xml test package
      - name: Stage Windows Engineering Preview 0.2.5
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/$BUNDLE_NAME"
          rm -rf "$root"
          mkdir -p "$root/preview/runtime/orekit-data" "$root/sidecar/orekit-service" "$root/scripts" "$root/preview/results"
          cp start-preview.bat pyproject.toml README.md "$root/"
          cp -a src scenarios "$root/"
          ROOT="$root" python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          release_app = root / 'src/constellation_control/preview/release_app.py'
          text = release_app.read_text(encoding='utf-8')
          old = 'from constellation_control.preview.app import _safe_result_file'
          new = 'from constellation_control.preview.result_paths import safe_result_file as _safe_result_file'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy result-path import in release_app.py')
          release_app.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f "$root/src/constellation_control/preview/app.py"
          cp preview/start-preview-bootstrap.ps1 preview/start-preview.ps1 preview/requirements-preview.lock preview/README.md preview/USER_GUIDE_RU_EN.md preview/EXPERT_FEEDBACK.md preview/ENGINEERING_PREVIEW_0.2_RU_EN.md "$root/preview/"
          cp scripts/fingerprint_orekit_data.py "$root/scripts/"
          cp sidecar/orekit-service/orekit-data-revision.txt sidecar/orekit-service/orekit-data-sha256.txt sidecar/orekit-service/orekit-data-mirror-revision.txt "$root/sidecar/orekit-service/"
          cp sidecar/orekit-service/target/orekit-service-0.1.0-SNAPSHOT.jar "$root/preview/runtime/orekit-service.jar"
          (cd "$OREKIT_DATA_PATH" && tar --exclude=.git -cf - .) | (cd "$root/preview/runtime/orekit-data" && tar -xf -)
          touch "$root/preview/results/.gitkeep"
          ROOT="$root" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['ROOT'])
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              files.append({'path': rel, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'size': path.stat().st_size})
          manifest = {
              'product': 'OC GNSS STRUCT CONTROL',
              'release': 'Engineering Preview Python 0.2.5',
              'target': 'Windows 10/11 engineering evaluation',
              'commit': os.environ['PREVIEW_SOURCE_SHA'],
              'python': '3.12',
              'java_high_fidelity_requirement': '17+',
              'orekit': '13.1.7',
              'orekit_data_revision': os.environ['OREKIT_DATA_REVISION'],
              'orekit_data_sha256': os.environ['OREKIT_DATA_SHA256'],
              'operator_surface': [
                  'gravity_release_app', 'consolidated_release_app', 'scenario_editor', 'gravity_model',
                  'walker', 'osculating', 'norad_tle', 'gps_almanac', 'glonass_almanac',
                  'iac_gnss_intake', 'galileo_gsc_almanac',
                  'perturbation_designer', 'spacecraft_workbook', 'spacecraft_catalog',
                  'resource_state', 'completed_run_promotion'
              ],
              'authority_invariant': 'screening never authority; operational credibility requires Orekit numerical validation',
              'scenario_editor_invariant': 'validate full ScenarioConfig and save only as a new YAML; existing scenarios are never overwritten',
              'launcher_invariant': 'CLI preview imports gravity_release_app, which wraps consolidated_release_app; packaged release_app uses result_paths and legacy preview/app.py is excluded',
              'gravity_model_invariant': 'operator may select Kepler 0x0, J2-class 2x0, or EIGEN-6S degree/order up to 32x32; order must not exceed degree',
              'venv_invariant': 'never copy .venv-preview between PCs; bootstrap creates it on the target PC from local Python 3.12',
              'files': files,
          }
          (root / 'preview-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          (cd "$RUNNER_TEMP" && zip -q -r "$GITHUB_WORKSPACE/$BUNDLE_NAME.zip" "$BUNDLE_NAME")
          sha256sum "$BUNDLE_NAME.zip" | tee "$BUNDLE_NAME.zip.sha256"
      - name: Verify Preview 0.2.5 bundle contract
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BUNDLE_NAME.zip"
          test -s "$BUNDLE_NAME.zip.sha256"
          unzip -l "$BUNDLE_NAME.zip" | grep 'preview/runtime/orekit-service.jar'
          unzip -p "$BUNDLE_NAME.zip" "$BUNDLE_NAME/src/constellation_control/preview/consolidated_release_app.py" | grep 'PREVIEW_VERSION = "0.2.5"'
          unzip -p "$BUNDLE_NAME.zip" "$BUNDLE_NAME/src/constellation_control/cli/main.py" | grep 'gravity_release_app'
          unzip -p "$BUNDLE_NAME.zip" "$BUNDLE_NAME/src/constellation_control/preview/release_app.py" | grep 'preview.result_paths import safe_result_file as _safe_result_file'
          if unzip -p "$BUNDLE_NAME.zip" "$BUNDLE_NAME/src/constellation_control/preview/release_app.py" | grep -q 'preview.app import'; then
            echo 'packaged release_app.py still depends on legacy preview.app' >&2
            exit 1
          fi
          unzip -p "$BUNDLE_NAME.zip" "$BUNDLE_NAME/preview/start-preview.ps1" | grep 'Engineering Preview Python 0.2.5'
          unzip -p "$BUNDLE_NAME.zip" "$BUNDLE_NAME/pyproject.toml" | grep 'version = "0.2.5"'
          if unzip -l "$BUNDLE_NAME.zip" | grep -q "$BUNDLE_NAME/src/constellation_control/preview/app.py"; then
            echo 'legacy preview/app.py must not ship' >&2
            exit 1
          fi
          for module in result_paths gravity_model_ui gravity_release_app walker_input osculating_input norad_input gnss_almanac_input glonass_almanac_input iac_gnss_intake galileo_gsc_input perturbation_ui workbook_upload spacecraft_catalog_ui resource_state_ui run_promotion_ui; do
            unzip -l "$BUNDLE_NAME.zip" | grep "src/constellation_control/preview/${module}.py"
          done
          manifest_release="$(unzip -p "$BUNDLE_NAME.zip" "$BUNDLE_NAME/preview-manifest.json" | python -c 'import json,sys; print(json.load(sys.stdin)["release"])')"
          manifest_sha="$(unzip -p "$BUNDLE_NAME.zip" "$BUNDLE_NAME/preview-manifest.json" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          test "$manifest_release" = 'Engineering Preview Python 0.2.5'
          test "$manifest_sha" = "$PREVIEW_SOURCE_SHA"
      - name: Upload Engineering Preview 0.2.5
        uses: actions/upload-artifact@v4
        with:
          name: engineering-preview-python-0.2.5-win10
          retention-days: 14
          if-no-files-found: error
          path: |
            engineering-preview-python-0.2.5-win10.zip
            engineering-preview-python-0.2.5-win10.zip.sha256

  windows-preview-025-smoke:
    needs: build-preview-025-bundle
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source Windows contracts
        shell: powershell
        run: |
          $bootstrap = Get-Content -LiteralPath preview\start-preview-bootstrap.ps1 -Raw
          [void][scriptblock]::Create($bootstrap)
          $launcher = [System.IO.File]::ReadAllText((Resolve-Path preview\start-preview.ps1), [System.Text.Encoding]::UTF8)
          [void][scriptblock]::Create($launcher)
          python -m pip install -U pip
          pip install -e '.[dev]'
          pytest -q tests/test_preview_consolidated_release.py tests/test_preview_windows_bootstrap_contract.py tests/test_preview_release_http.py tests/test_preview_closed_loop_http.py tests/test_preview_workflow_http.py tests/test_gps_almanac_derived_scenario.py tests/test_glonass_derived_scenario.py tests/test_lineage_hash_integrity.py tests/test_gravity_model_ui.py tests/test_gravity_model_launcher_contract.py tests/test_gravity_model_pr_gate.py tests/test_gravity_model_force_fingerprint_contract.py
      - uses: actions/download-artifact@v4
        with:
          name: engineering-preview-python-0.2.5-win10
          path: package-artifact
      - name: Run real packaged clean-Windows acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Resolve-Path '.\package-artifact\engineering-preview-python-0.2.5-win10.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'preview-025-e2e'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -LiteralPath $bundle -DestinationPath $extract
          $root = Join-Path $extract 'engineering-preview-python-0.2.5-win10'
          if (Test-Path (Join-Path $root 'src\constellation_control\preview\app.py')) { throw 'legacy preview/app.py shipped unexpectedly' }
          $releaseApp = Get-Content -LiteralPath (Join-Path $root 'src\constellation_control\preview\release_app.py') -Raw
          if ($releaseApp -match 'preview\.app import') { throw 'packaged release_app still imports legacy preview.app' }
          $pinned = (Get-Content -LiteralPath (Join-Path $root 'sidecar\orekit-service\orekit-data-revision.txt') -Raw).Trim()
          $pinnedSha = (Get-Content -LiteralPath (Join-Path $root 'sidecar\orekit-service\orekit-data-sha256.txt') -Raw).Trim()
          $env:OREKIT_DATA_PATH = Join-Path $root 'preview\runtime\orekit-data'
          $previewOut = Join-Path $env:RUNNER_TEMP 'preview-025.out.log'
          $previewErr = Join-Path $env:RUNNER_TEMP 'preview-025.err.log'
          $cmd = '"' + (Join-Path $root 'start-preview.bat') + '" -Python python -NoBrowser -Port 8876'
          $preview = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/c',$cmd) -WorkingDirectory $root -RedirectStandardOutput $previewOut -RedirectStandardError $previewErr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 360; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8876/health' -TimeoutSec 1
                if ($health.preview -eq '0.2.5') { $ready = $true; break }
              } catch { }
              if ($preview.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              Get-Content $previewOut -ErrorAction SilentlyContinue
              Get-Content $previewErr -ErrorAction SilentlyContinue
              throw 'Packaged Engineering Preview 0.2.5 did not become ready'
            }
            $homeResponse = Invoke-WebRequest -Uri 'http://127.0.0.1:8876/' -UseBasicParsing -TimeoutSec 2
            if ($homeResponse.Content -notmatch 'gravityModelCard') { throw 'Gravity model card missing from packaged Preview UI' }
            if ($homeResponse.Content -notmatch 'EIGEN-6S 32x32') { throw '32x32 gravity preset missing from packaged Preview UI' }
            if ($homeResponse.Content -notmatch 'Galileo — официальный GSC Almanac') { throw 'Galileo GSC card missing from packaged Preview UI' }
            if ($homeResponse.Content -notmatch 'IAC GNSS') { throw 'IAC GNSS intake card missing from packaged Preview UI' }
            $authority = Invoke-RestMethod -Uri 'http://127.0.0.1:8081/healthz' -TimeoutSec 2
            if ($authority.orekit_version -ne '13.1.7') { throw "Wrong Orekit version: $($authority.orekit_version)" }
            if ($authority.orekit_data_revision -ne $pinned) { throw "Wrong Orekit data revision: $($authority.orekit_data_revision)" }
            if ($authority.orekit_data_sha256 -ne $pinnedSha) { throw "Wrong Orekit data SHA: $($authority.orekit_data_sha256)" }
            Write-Host "PACKAGED WINDOWS ACCEPTANCE READY: preview=0.2.5 orekit=$($authority.orekit_version) revision=$($authority.orekit_data_revision) gravity=0x0..32x32 GNSS=GLONASS/GPS/BeiDou/Galileo"
          } finally {
            if (-not $preview.HasExited) { & taskkill.exe /PID $preview.Id /T /F | Out-Host }
            $owner = Get-NetTCPConnection -State Listen -LocalPort 8081 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($owner) { Stop-Process -Id $owner.OwningProcess -Force -ErrorAction SilentlyContinue }
          }
